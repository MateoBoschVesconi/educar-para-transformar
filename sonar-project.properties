# =====================================================================
# Configuración de Orquestador Centralizado SonarCloud / SonarQube
# Proyecto: Educar Para Transformar - Universal App
# =====================================================================

sonar.projectKey=mateobosch_educar-para-transformar
sonar.organization=mateobosch-github
sonar.projectName=Educar Para Transformar - Universal App
sonar.projectVersion=1.0.0

# Rutas de código fuente y pruebas
sonar.sources=universal-app/src
sonar.tests=universal-app/cypress
sonar.test.inclusions=universal-app/cypress/**/*.cy.{js,ts},universal-app/src/**/*.test.{ts,tsx}

# Codificación y exclusiones
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/.expo/**,**/assets/**,**/*.config.js,**/*.d.ts

# Métricas y Cobertura de Pruebas
sonar.javascript.lcov.reportPaths=universal-app/coverage/lcov.info
sonar.qualitygate.wait=false
